{% extends "base.html" %}
{% from "macros.html" import csrf_field %}
{% block title %}Set up LibraryOfMyOwn{% endblock %}
{% block head_meta %}
<meta name="robots" content="noindex">
{% endblock %}
{% block content %}
<h1>Set up LibraryOfMyOwn</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="simple-form setup-form">
  {{ csrf_field(csrf_token) }}
  <label>
    Admin password
    <input type="password" name="admin_password" required autofocus minlength="8">
  </label>
  <label>
    Confirm admin password
    <input type="password" name="admin_password_confirm" required minlength="8">
  </label>
  <label>
    Public site URL
    <input type="url" name="public_url" value="{{ suggested_public_url }}" required>
  </label>
  <button type="submit">Finish setup</button>
</form>
{% endblock %}
